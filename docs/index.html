<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cobre Notifier API - Documentación</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentación del sistema de notificaciones event-driven para Cobre">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme: Simple Dark -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <style>
    :root {
      --theme-color: #42b983;
      --sidebar-width: 300px;
    }
    
    /* Fix initial layout shift */
    * {
      box-sizing: border-box;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      height: 100%;
    }
    
    #app {
      min-height: 100vh;
      width: 100%;
      opacity: 1;
      visibility: visible;
    }
    
    /* Prevent FOUC */
    .sidebar,
    .markdown-section {
      will-change: transform;
    }
    
    .app-name-link img {
      max-width: 200px;
      margin-bottom: 1rem;
    }
    
    .sidebar {
      background-color: #2d2d2d;
    }
    
    .markdown-section {
      max-width: 900px;
    }
    
    /* GitHub Corner - Top Right */
    .github-corner {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 1000;
      border: 0;
    }
    
    .github-corner:hover .octo-arm {
      animation: octocat-wave 560ms ease-in-out;
    }
    
    @keyframes octocat-wave {
      0%, 100% { transform: rotate(0); }
      20%, 60% { transform: rotate(-25deg); }
      40%, 80% { transform: rotate(10deg); }
    }
    
    .github-corner svg {
      fill: #42b983;
      color: #fff;
      width: 80px;
      height: 80px;
    }
    
    /* Badges styling */
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem 0 1.5rem 0;
      align-items: center;
    }
    
    .badge {
      display: inline-block;
      padding: 0.35rem 0.65rem;
      border-radius: 3px;
      font-size: 0.85em;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      line-height: 1.4;
      transition: opacity 0.2s;
    }
    
    .badge:hover {
      opacity: 0.8;
    }
    
    .badge-npm {
      background-color: #cb3837;
    }
    
    .badge-license {
      background-color: #f7df1e;
      color: #000;
    }
    
    .badge-java {
      background-color: #ed8b00;
    }
    
    .badge-spring {
      background-color: #6db33f;
    }
    
    .badge-coverage {
      background-color: #25c2a0;
    }
    
    .badge-kafka {
      background-color: #231f20;
    }
    
    /* Mermaid diagram styling */
    .mermaid {
      text-align: center;
      margin: 2rem 0;
      background: #1e1e1e;
      padding: 1rem;
      border-radius: 4px;
    }
    
    /* Code block styling for Mermaid source */
    .mermaid-source {
      margin-top: 1rem;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <!-- GitHub Corner -->
  <a href="https://github.com/hbalmes/cobre-notifier-api" class="github-corner" aria-label="View source on GitHub" target="_blank">
    <svg width="80" height="80" viewBox="0 0 250 250" style="fill:#42b983; color:#fff; position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true">
      <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
      <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
      <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,98.4 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.3 C148.5,53.7 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
    </svg>
  </a>
  <div id="app"></div>
  
  <script>
    window.$docsify = {
      name: 'Cobre Notifier API',
      repo: 'https://github.com/hbalmes/cobre-notifier-api',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      homepage: 'README.md',
      themeable: {
        readyTransition: true,
        defaultTheme: 'simple-dark'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar...',
        noData: 'No se encontraron resultados',
        depth: 6
      },
      pagination: {
        previousText: '← Anterior',
        nextText: 'Siguiente →',
        crossChapter: true,
        crossChapterText: true,
      },
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(html) {
            // Fix external links
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(match, text, url) {
              if (url.startsWith('http')) {
                return '<a href="' + url + '" target="_blank">' + text + '</a>';
              }
              return match;
            });
            return html;
          });
          
          // Fix anchor IDs after content is rendered
          hook.doneEach(function() {
            // Fix heading IDs to match table of contents links
            var headings = document.querySelectorAll('.markdown-section h1, .markdown-section h2, .markdown-section h3');
            headings.forEach(function(heading) {
              var text = heading.textContent || heading.innerText;
              // Remove emojis and special characters, convert to lowercase, replace spaces with hyphens
              var id = text.replace(/[\u{1F300}-\u{1F9FF}]/gu, '').trim().toLowerCase()
                .replace(/\s+/g, '-')
                .replace(/[^\w\-]/g, '');
              heading.id = id;
            });
          });
        }
      ]
    }
  </script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/external-script.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  
  <!-- Mermaid and docsify-mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    // Initialize Mermaid with dark theme
    mermaid.initialize({
      theme: 'dark',
      startOnLoad: false,
      securityLevel: 'loose',
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true
      }
    });
  </script>
  <script src="https://unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
</body>
</html>
