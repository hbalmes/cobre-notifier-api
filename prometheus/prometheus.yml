global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'cobre-notifier'
    environment: 'development'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Cobre Notifier API
  - job_name: 'cobre-notifier-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
    scrape_interval: 10s
    scrape_timeout: 5s

